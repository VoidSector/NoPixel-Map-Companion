# Keeps the time-played leaderboard (https://voidsector.github.io/NoPixel-Map-Companion/) up to date:
# one look at the live NoPixel feed adds the time since the last look, and the page and its data are
# published to GitHub Pages. The totals live in the published site (state.json).
#
# Every ~10 minutes: each run starts leaderboard-timer.yml, which waits 9 minutes (its environment's
# wait timer, no runner meanwhile) and starts the next run. GitHub's own schedule is only "best effort"
# (often late, sometimes not at all), so the cron below is just the backstop that restarts the chain.
name: Time played leaderboard

on:
  schedule:
    - cron: '7,37 * * * *'   # off the round minutes, when GitHub is busiest
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['leaderboard/**', '.github/workflows/leaderboard.yml']

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # to start the timer

concurrency:
  group: leaderboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Count the time since the last look
        run: node leaderboard/update.mjs site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Start the timer for the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run leaderboard-timer.yml -R "$GITHUB_REPOSITORY"
