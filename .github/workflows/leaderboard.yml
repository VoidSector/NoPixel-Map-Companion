# Keeps the time-played leaderboard (https://voidsector.github.io/NoPixel-Map-Companion/) up to date.
# One run an hour: a look at the live NoPixel feed every 10 minutes (6 looks: leaderboard/loop.mjs runs
# update.mjs), each adding the time since the last look, then the site is published once (one Pages
# deployment an hour). At its end the run starts the next one. GitHub's own schedule is only "best effort"
# (often late, sometimes not at all), so the cron below is just the backstop that restarts the chain if a
# run ever dies without starting the next. The totals live in the published site (state.json) and, since
# Pages can serve an old copy for a while after a deploy, in the Actions cache too (the newer one is used).
name: Time played leaderboard

on:
  schedule:
    - cron: '7,37 * * * *'   # the backstop (off the round minutes, when GitHub is busiest)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['leaderboard/**', '.github/workflows/leaderboard.yml']

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # to start the next run

concurrency:
  group: leaderboard
  cancel-in-progress: false

jobs:
  # counting: an hour of looks (no environment, so it makes no deployment)
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      deploy: ${{ steps.count.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The totals from the last run (there at once, unlike the published site)
        uses: actions/cache/restore@v4
        with:
          path: lb-state
          key: lb-state-${{ github.run_id }}
          restore-keys: lb-state-
      - name: A look every 10 minutes for an hour
        id: count
        run: node leaderboard/loop.mjs site
        env:
          LB_CACHED_STATE: lb-state/state.json
          LB_LOOKS: ${{ github.event_name == 'push' && '1' || '6' }}   # (a change to the page: published at once)
      - name: Keep the totals for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: lb-state
          key: lb-state-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        if: steps.count.outputs.deploy == 'true'
        with:
          path: site
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run leaderboard.yml -R "$GITHUB_REPOSITORY"
  # publishing: once, at the end of the hour
  deploy:
    needs: update
    if: needs.update.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
